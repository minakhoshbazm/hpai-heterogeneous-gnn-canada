[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpai_gnn"
version = "0.1.0"
description = "A Heterogeneous Spatiotemporal Graph Neural Network Integrating Wild Bird Migrations for Avian Influenza Risk in Canada"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Mina Khoshbazm", email = "mkhoshba@alliancecan.ca" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hpai_gnn*"]
